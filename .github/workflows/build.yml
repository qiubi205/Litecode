name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK 用 runner 自带（已预装 platform-34/build-tools），
      # 不再手动装包：android-actions/setup-android@v3 会跑 sdkmanager 装 `tools`，
      # 该包已从 SDK 仓库下架，必挂（2026-09-18 CI 实锤）。
      # AGP 会按需自动拉缺失组件并自动接受 license。
      - name: Verify Android SDK
        run: sdkmanager --list_installed | head -20

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Also build debug APK (unsigned fallback)
        run: gradle assembleDebug --no-daemon

      - name: Extract version
        id: ver
        run: echo "name=v${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT 2>/dev/null || echo "name=debug" >> $GITHUB_OUTPUT

      - name: Upload debug APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: ${{ github.ref_name }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Litecode-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Litecode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
